name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'

      # Regenerate Android platform files with valid project name
      - name: Regenerate Android platform files
        run: |
          rm -rf android
          flutter create --platforms=android --project-name cursordroid .

      # 🔥 Add INTERNET permission to the main AndroidManifest.xml
      - name: Add INTERNET permission
        run: |
          MANIFEST_PATH="android/app/src/main/AndroidManifest.xml"
          # Insert the permission line after <manifest ...> tag if not already present
          if ! grep -q "android.permission.INTERNET" "$MANIFEST_PATH"; then
            sed -i '/<manifest/a\    <uses-permission android:name="android.permission.INTERNET"/>' "$MANIFEST_PATH"
          fi
          cat "$MANIFEST_PATH"  # print to verify

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
